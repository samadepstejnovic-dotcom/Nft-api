<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT Guarantee</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #17212b);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #708499);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #232e3c);
        }
        body { font-family: sans-serif; background: var(--bg-color); color: var(--text-color); margin: 0; padding: 16px; padding-bottom: 80px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        h1 { font-size: 24px; margin: 0; }
        .lang-btn { background: var(--secondary-bg); color: var(--text-color); border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .card { background: var(--secondary-bg); border-radius: 12px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .card-info h3 { margin: 0 0 4px 0; font-size: 16px; }
        .card-info p { margin: 0; color: var(--hint-color); font-size: 14px; }
        .price { font-weight: bold; font-size: 18px; color: #4caf50; }
        .loading { text-align: center; color: var(--hint-color); margin-top: 40px; }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="title">Мои сделки</h1>
        <button class="lang-btn" onclick="toggleLang()">EN</button>
    </div>
    <div id="offers-list"><div class="loading">Загрузка...</div></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const translations = {
            ru: { title: "Мои сделки", noOffers: "У вас пока нет активных сделок", status: "Статус", loading: "Загрузка..." },
            en: { title: "My Deals", noOffers: "You don't have any active deals yet", status: "Status", loading: "Loading..." }
        };

        let currentLang = 'ru';
        let offers = [];

        function toggleLang() {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            document.querySelector('.lang-btn').innerText = currentLang === 'ru' ? 'EN' : 'RU';
            updateUI();
        }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('title').innerText = t.title;
            renderOffers();
        }

        // ТВОЯ ССЫЛКА НА RENDER
        const API_URL = "https://nft-api-1tnt.onrender.com/api/offers";

        async function loadOffers() {
            try {
                const res = await fetch(API_URL);
                offers = await res.json();
                renderOffers();
            } catch (e) {
                document.getElementById('offers-list').innerHTML = `<p style="text-align:center; color:red">Ошибка загрузки данных</p>`;
            }
        }

        function renderOffers() {
            const list = document.getElementById('offers-list');
            const t = translations[currentLang];
            list.innerHTML = '';

            if (offers.length === 0) {
                list.innerHTML = `<p style="text-align:center; color:var(--hint-color)">${t.noOffers}</p>`;
                return;
            }

            offers.forEach(o => {
                const card = document.createElement('div');
                card.className = 'card';
                const icon = o.cur === 'stars' ? '⭐' : 'GRAM';
                card.innerHTML = `
                    <div class="card-info">
                        <h3>${o.title}</h3>
                        <p>${t.status}: ${o.status}</p>
                    </div>
                    <div class="price">${o.price} ${icon}</div>
                `;
                list.appendChild(card);
            });
        }

        loadOffers();
        updateUI();
    </script>
</body>
</html>
